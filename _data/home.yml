headline: "Selective coordination for scalable robot teams"
summary: >-
  I am a robotics researcher developing planning systems that enable robot teams
  to work together on complex tasks. My work makes coordination practical as teams
  grow by identifying which decisions require joint planning and accelerating the
  necessary computation. I am extending these foundations through learning and
  human–robot interaction, so teams can reuse experience and people can guide and
  revise their plans.

at_a_glance:
  - label: Research record
    text: 16 peer-reviewed publications
    href: /publications/
  - label: Mentoring
    text: 20+ graduate researchers mentored
    href: /#leadership
  - label: Research leadership
    text: 3 open-source planning libraries led
    href: /#leadership

research_intro: >-
  Robot teams could make manufacturing and logistics more flexible, but
  coordinating more robots creates a rapidly growing planning problem. Planning
  robots independently can miss necessary interactions; planning the entire team
  jointly becomes expensive. My research determines what must be planned together
  and makes the resulting computation efficient.

foundations:
  - id: selective-coordination
    title: Selective Coordination in Multi-Robot Planning
    subtitle: Decide what must be planned together.
    body: >-
      Robot teams need to coordinate, but not every decision needs to involve the whole
      team. I develop representations and algorithms that use task requirements and
      conflicts between planned motions to determine which robots, objects, and motion
      segments should be considered together. They expand joint planning where needed
      and preserve independent work elsewhere, rather than fixing the scope of
      coordination in advance.
    extension_label: Selected result
    extension: >-
      Lazy-DaSH planned rearrangements with eight robot arms and more than 40 objects.
    publications:
      - id: motes2023hypergraph
        label: DaSH
      - id: solis2024arc
        label: ARC
      - id: lee2025lazydash
        label: Lazy-DaSH
  - id: accelerated-infrastructure
    title: Accelerated Planning Infrastructure
    subtitle: Organize the necessary work—and avoid the rest.
    body: >-
      Smaller planning problems still require substantial search and collision
      checking. I use the independence preserved by selective coordination to run
      searches and repairs in parallel, and tailor collision checking to the
      information each planning decision needs. These methods avoid unnecessary
      geometric work and organize the remaining computation for efficient execution
      on CPUs and GPUs, supporting larger robot teams and replanning in changing
      environments.
    extension_label: Selected result
    extension: >-
      On a benchmark with sixteen seven-joint robot arms, P-ARC achieved a median
      planning time of 1.1 seconds—a 4× speedup over sequential ARC.
    publications:
      - id: motes2026parc
        label: P-ARC
      - id: motes2026milliseconds
        label: Vector-Accelerated Planning
      - id: ashur2024spite
        label: SPITE

future_intro: >-
  My future research asks how robot teams can improve through experience and
  collaborate with people, using these foundations to verify and revise plans.
future_directions:
  - id: learning-guided-coordination
    title: Learning-Guided Coordination
    subtitle: Use experience to guide coordination—and coordination to organize experience.
    body: >-
      I will study how experience from planning and execution can improve decisions about which 
      robots should coordinate, when, and how. Learned policies or explicit reuse of past 
      solutions can guide these decisions. In turn, selective coordination can organize 
      experience around local interactions, providing structure for learning across tasks, 
      teams, and environments. The planner will check feasibility and revise coordination 
      or replan when guidance is insufficient.
    extension_label: Starting point
    extension: >-
      Preliminary work explores reusable task-level coordination strategies and reuse
      of solutions to local motion-planning problems.
    publications:
      - id: solis2024experience
        label: Experience-Based Subproblem Planning
  - id: interactive-planning
    title: Interactive Planning
    subtitle: Let people inspect and revise multi-robot plans without programming individual robots.
    body: >-
      I will study what information people and planners should exchange, and when to
      use visualization, direct manipulation, or language. People might mark regions
      to keep clear; planners could explain conflicts or alternatives. The challenge
      is to translate this exchange into planning decisions, validate revisions, and
      preserve unaffected tasks and motions.
    extension_label: Starting point
    extension: >-
      ERUPT, developed with collaborators and students I mentored, lets users configure
      workspaces and visualize planned robot motions in AR/VR.
    publications:
      - id: ngui2025erupt
        label: ERUPT

