summary: >-
  I develop planning systems that help large robot teams work together efficiently.
  My methods determine which robots need to coordinate and speed up motion planning.
  Motivated by my industry and startup experience in automated manufacturing,
  I am extending this work so robot teams can learn
  from experience and adapt as people direct and participate in their work.

results:
  scale: "16 robots and 60 objects."
  # Table I: median successful solve time, four-Panda Cage benchmark (N=50).
  # https://arxiv.org/html/2604.23960v2#S1.T1
  speed: "Generate motion plans for four seven-joint arms in 50 ms."

